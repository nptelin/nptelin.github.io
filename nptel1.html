<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NPTEL Certificate</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Georgia, "Times New Roman", serif;
    }

    body{
      width:100%;
      height:100vh;
      background:#5f5f5f;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }

    .certificate-btn{
      background:#2f73d8;
      color:#ffffff;
      border:none;
      border-radius:14px;
      padding:18px 58px;
      font-size:28px;
      font-weight:400;
      letter-spacing:0.2px;
      cursor:pointer;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 2px 3px rgba(0,0,0,0.22);

      transition:0.15s ease;
    }

    .certificate-btn:hover{
      filter:brightness(1.03);
    }

    .certificate-btn:active{
      transform:scale(0.99);
    }

    @media (max-width:768px){

      .certificate-btn{
        font-size:24px;
        padding:16px 46px;
        border-radius:13px;
      }

    }
  </style>
</head>

<body>

  <button class="certificate-btn" onclick="openPDF()">
    Course Certificate
  </button>

  <script>
    function openPDF() {
      window.open(
        "Aspen%20Plus%C2%AE%20Simulation%20Software%20-%20A%20Basic%20Course%20for%20Beginners.pdf",
        "_blank"
      );
    }
  </script>

</body>
</html>
